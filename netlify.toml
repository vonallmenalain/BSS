[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  NPM_FLAGS = "--no-audit --no-fund"

# Serverseitiges gibt es an zwei Stellen: den Kalender-Feed
# (`netlify/functions/ap-ics.mts`) – er teilt sich den ICS-Bau mit der App,
# esbuild löst den Import aus `src/lib` beim Bündeln auf – und die Auskunft
# über den Ort eines Zugriffs (`whereami.mts`) für das Zugriffsprotokoll.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Der Aktivitätenplan als abonnierbarer Kalender.
#
# Muss VOR dem SPA-Fallback stehen: Umleitungen werden der Reihe nach geprüft,
# und die Regel darunter fängt sonst auch diese Adresse ab – ein
# Kalenderprogramm bekäme HTML statt Terminen.
[[redirects]]
  from = "/api/ap.ics"
  to = "/.netlify/functions/ap-ics"
  status = 200

# Von wo aus jemand zugreift – für das Zugriffsprotokoll unter «Einstellungen».
# Muss wie oben VOR dem SPA-Fallback stehen, sonst bekäme die App HTML zurück,
# wo sie eine Ortsangabe erwartet.
[[redirects]]
  from = "/api/standort"
  to = "/.netlify/functions/whereami"
  status = 200

# SPA-Fallback: alle Routen an index.html, damit React Router die URL übernimmt.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), interest-cohort=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    # Die App enthält Personendaten – Suchmaschinen und Archive fernhalten.
    X-Robots-Tag = "noindex, nofollow, noarchive"

# Gehashte Assets sind unveränderlich und dürfen lange gecacht werden.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Service Worker und Manifest niemals langfristig cachen,
# sonst erhalten installierte PWAs keine Updates mehr.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# Dasselbe für den Service Worker der Montags-Erinnerung («Impuls»).
[[headers]]
  for = "/impuls-push-sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json; charset=utf-8"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
